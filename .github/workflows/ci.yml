name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ruff / mypy / pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıkları kur
        run: pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy src tests
      - name: pytest
        run: pytest -q

  security:
    name: gitleaks / pip-audit
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.28.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: pip-audit
        run: |
          pip install -e ".[dev]" pip-audit
          pip-audit --skip-editable

  docker:
    name: Docker imajı
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t tradebot:${{ github.sha }} .
