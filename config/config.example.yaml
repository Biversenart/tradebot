# Örnek yapılandırma — kopyala: config/config.yaml
mode: paper                     # backtest | paper | testnet | live
live_trading_confirmed: false   # live için .env'de TRADING_MODE=live ile BİRLİKTE true olmalı
base_currency: USDT
log_level: INFO                 # DEBUG | INFO | WARNING | ERROR

egress:
  mode: wireguard               # direct_vps | wireguard | proxy | managed_proxy
  # proxy URL'si ve beklenen IP .env'den okunur (EGRESS_PROXY_URL, EGRESS_EXPECTED_IP)
  check_interval_minutes: 5
  request_timeout_seconds: 10
  ip_check_services: ["https://api.ipify.org", "https://ifconfig.me/ip"]
  fail_closed: true             # değiştirilemez; kod false'u reddeder

exchanges:
  binance:
    enabled: true
    market_type: spot           # spot | futures
    testnet: true
  btcturk:
    enabled: false

universe:
  mode: fixed                   # fixed | scanner
  symbols: ["BTC/USDT", "ETH/USDT", "SOL/USDT"]
  scanner:
    top_n: 10
    min_24h_volume_usdt: 50000000
    max_spread_pct: 0.05

analysis:
  timeframes:
    long: ["1w", "1d"]
    mid: ["4h", "1h"]
    short: ["15m", "5m"]
  indicators:
    ema_periods: [9, 21, 50, 200]
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bb_period: 20
    bb_std: 2
    atr_period: 14
    adx_period: 14
    volume_sma: 20
  regime:
    adx_trend: 25                 # ADX >= bu değer: trend
    ema_fast: 50                  # eğimi ölçülen EMA
    ema_slow: 200                 # fiyatın üstünde/altında olduğu EMA
    slope_bars: 10
    percentile_lookback: 200      # Bollinger genişliği yüzdeliği penceresi
    volatility_lookback: 500      # ATR% medyan penceresi
    volatile_atr_ratio: 2.0       # ATR% >= 2 x medyan: yüksek volatilite
    squeeze_bb_percentile: 0.15   # BB genişliği alt %15: sıkışma
  structure:
    swing_lookback: 3             # fraktal: her iki yanda N mum
  zones:
    cluster_atr: 0.6              # swing fiyatları bu x ATR içindeyse aynı bölge
    min_touches: 2
    max_zones: 8
    impulse_atr: 1.5              # arz/talep: gövde >= 1.5 ATR olan itki mumu
    base_max_body_atr: 0.5        # itki öncesi taban mumu gövdesi <= 0.5 ATR
    equal_level_atr: 0.15         # eşit tepe/dip toleransı (likidite havuzu)
    proximity_atr: 1.0            # "bölgeye yakın" eşiği
  volume_profile:
    bins: 50
    value_area_pct: 70
    lookback_bars: 300
  patterns:
    doji_body_pct: 0.1
    pin_wick_body_ratio: 2
    level_tolerance_atr: 0.5      # çift tepe/OBO seviye toleransı
    min_pattern_bars: 10
    triangle_flat_slope_atr: 0.05
    flag_pole_atr: 3
    channel_lookback: 50
    channel_std: 2
  divergence:
    min_bars_between: 5
    max_bars_between: 60
  confluence:
    min_score: 70
    htf_conflict_penalty: 0.5     # üst TF tersine ise puan x0.5
    recent_bars: 5
    weights:
      htf_trend_alignment: 25
      zone_proximity: 20
      structure_confirmation: 15
      volume_confirmation: 10
      pattern: 10
      divergence: 10
      regime_fit: 10
  trade_plan:
    min_risk_reward: 2.0
    sl_atr_buffer: 0.5
    max_stop_atr: 4                  # stop mesafesi > 4 ATR ise plan reddedilir
    take_profits: [1.0, 2.0, 3.0]   # R katları
    tp1_close_pct: 40
    move_sl_to_breakeven_after_tp1: true
    trailing: atr                    # atr | structure | none
    time_exit_bars: 48
  llm_commentary: false

strategies:
  ema_crossover:   { enabled: true,  fast: 9, slow: 21, trend_filter: 200, timeframe: 1h }
  rsi_reversion:   { enabled: true,  period: 14, buy_below: 30, sell_above: 70, timeframe: 15m }
  breakout:        { enabled: true,  donchian: 20, volume_mult: 1.5, timeframe: 4h }
  grid:            { enabled: false, lower: 0, upper: 0, levels: 10 }
  dca:             { enabled: false }
  signal_combiner: { enabled: false }

backtest:
  initial_equity: 10000
  commission_pct: 0.1            # taraf başı (taker)
  slippage_bps: 5
  latency_bars: 1                # sinyal kapanışta -> dolum sonraki mumun açılışında (>=1)
  allow_short: true
  trailing_atr_mult: 2.0
  structure_trail_bars: 10
  walk_forward:
    train_bars: 4320             # ~6 ay (1h)
    test_bars: 1440              # ~2 ay (1h)
    objective: expectancy        # expectancy | profit_factor | sharpe
    min_trades: 10
  param_grids: {}                # ör. { ema_crossover: { fast: [5, 9, 13], slow: [21, 34, 55] } }

arbitrage:
  cross_exchange:
    enabled: false
    pairs: ["BTC/USDT"]
    min_net_spread_pct: 0.25      # komisyon + kayma tamponu SONRASI net eşik
    max_leg_latency_ms: 500       # orderbook yaşı / bacaklar arası zaman farkı
    slippage_buffer_pct: 0.05     # derinlik tüketimine ek güvenlik payı
    max_notional_quote: 1000
    fx_symbols: {}                # TRY köprüsü: { btcturk: "USDT/TRY" } (BTC/USDT <-> BTC/TRY)
  triangular:
    enabled: false
    exchange: binance
    min_net_profit_pct: 0.15
    start_asset: USDT
    max_notional_quote: 1000
    max_book_age_ms: 1000
    symbols: ["BTC/USDT", "ETH/BTC", "ETH/USDT"]   # döngü marketleri (akışa eklenir)
  funding_rate: { enabled: false }
  rebalance:
    min_share_pct: 20             # bir borsada varlık payı bunun altına düşerse uyarı (manuel transfer)
  execute_in_paper: true          # v1: fırsatlar HER ZAMAN loglanır; işlem yalnızca paper modda
  min_interval_seconds: 2         # aynı rota için log tekrar aralığı

risk:
  risk_per_trade_pct: 1.0
  max_open_positions: 5
  max_exposure_per_symbol_pct: 20
  max_total_exposure_pct: 60
  daily_loss_limit_pct: 3.0
  max_drawdown_pct: 10.0
  max_consecutive_errors: 5
  max_leverage: 1
  max_spread_pct: 0.1
  on_kill_switch: close_all      # close_all | keep_positions
  max_correlation: 0.8
  var_confidence: 0.95
  growth:
    compounding: true
    quality_multiplier: { high_score: 1.5, low_score: 0.5 }   # risk_per_trade çarpanı
    kelly: { enabled: false, fraction: 0.25, min_trades: 100 }
    drawdown_scaling: { start_pct: 5, risk_factor: 0.5 }
    loss_streak: { count: 3, risk_factor: 0.5 }
    profit_lock: { enabled: true, every_gain_pct: 20, lock_pct: 25 }
    auto_allocation: { enabled: true, lookback_trades: 30, pause_if_expectancy_below: 0 }

operations:
  live_capital_cap_pct: 10
  shadow_mode: true
  stablecoin_depeg_threshold_pct: 0.5
  max_balance_per_exchange_usdt: 5000
  low_liquidity_mode: { enabled: true, weekend_risk_factor: 0.5 }
  watch_exchange_announcements: true

notify:
  telegram: { enabled: true, daily_summary_hour: 23 }

execution:
  enabled: true                  # strateji -> risk -> emir (marketdata.enabled gerekir)
  order_timeout_seconds: 60      # dolmayan kısım iptal edilir
  poll_interval_seconds: 2
  max_retries: 3                 # ağ hatasında; client_order_id ile idempotent
  maintenance_interval_seconds: 30   # borsa stop senkronu, equity, kill switch
  reconcile_on_start: true

marketdata:
  enabled: true
  candle_timeframes: ["1m", "5m", "15m", "1h", "4h", "1d"]   # trade akışından oluşturulan mumlar
  order_book_depth: 20
  warmup_bars: 300

paper:
  initial_balances: { USDT: 10000 }   # paper modda sahte başlangıç bakiyesi

heartbeat:
  enabled: false                # true: HEARTBEAT_URL'ye her interval_seconds'ta ping
  interval_seconds: 60

api:
  enabled: true
  host: 127.0.0.1
  port: 8080
