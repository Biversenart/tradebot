# Aşama 0: bot + postgres.
# UYARI: testnet/live için borsa trafiği sabit IP'li egress üzerinden çıkmalıdır
# (CLAUDE.md kural 8). WireGuard istemci servisi ve `network_mode: service:wireguard`
# Aşama 1'de eklenecek; o zamana kadar bu dosyayı yalnızca paper modda kullanın.
services:
  bot:
    build: .
    image: tradebot:latest
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}@postgres:5432/bot
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: bot
      POSTGRES_DB: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Port dışarı açılmaz; yalnızca compose ağı içinden erişilir.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
