[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tradebot"
version = "0.1.0"
description = "Kripto trade & arbitraj botu"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
    "aiohttp>=3.9",
    "aiohttp-socks>=0.9",
    "ccxt>=4.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
]

[project.scripts]
bot = "bot.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
# Türkçe metinlerdeki karakterler için belirsiz-karakter uyarıları kapalı.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "N817"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: gerçek ağa/testnet'e bağlanan testler (CI'da varsayılan olarak atlanır)",
]

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*", "pyarrow", "pyarrow.*", "plotly", "plotly.*"]
ignore_missing_imports = true
